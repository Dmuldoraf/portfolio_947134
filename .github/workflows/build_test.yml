name: Build and Test

on:
  push:
    branches-ignore:
      - main


jobs:
  flutter_test:
    name: Flutter Tests
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.0
      - run: flutter --version
      - run: flutter pub get
      - run: flutter test

  build_web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: flutter_test

    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.0
      - run: flutter --version
      - run: flutter pub get
      - run: flutter clean
      - run: flutter build web